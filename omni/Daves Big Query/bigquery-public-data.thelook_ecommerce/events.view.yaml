# Reference this view as bigquery_public_data_thelook_ecommerce__events
description: Programatically generated web events for The Look fictitious e-commerce store

catalog: bigquery-public-data
schema: thelook_ecommerce
table_name: events

dimensions:
  sequence_number: {}
  created_at: {}
  ip_address: {}
  city: {}
  state: {}
  postal_code: {}
  browser: {}
  traffic_source: {}
  uri: {}
  event_type: {}

  id:
    format: ID
    primary_key: true

  user_id:
    format: ID

  session_id:
    format: ID

measures:
  count:
    aggregate_type: count

# Reference this view as bigquery_public_data_thelook_ecommerce__order_items
description: Programatically generated order items for The Look fictitious e-commerce store

catalog: bigquery-public-data
schema: thelook_ecommerce
table_name: order_items

dimensions:
  created_at: {}
  shipped_at: {}
  delivered_at: {}
  returned_at: {}
  sale_price: {}

  id:
    format: ID
    primary_key: true

  order_id:
    format: ID

  user_id:
    format: ID

  product_id:
    format: ID

  inventory_item_id:
    format: ID

  status:
    description: Fulfillment state of the line item (e.g. Complete, Shipped,
      Processing, Cancelled, Returned)

measures:
  count:
    label: Order Items Count
    aggregate_type: count

  total_revenue:
    sql: ${sale_price}
    format: usdcurrency
    aggregate_type: sum

  average_sale_price:
    sql: ${sale_price}
    format: usdcurrency
    aggregate_type: average

  order_count:
    sql: ${order_id}
    aggregate_type: count_distinct

  customer_count:
    sql: ${user_id}
    aggregate_type: count_distinct

  returned_item_count:
    label: Returned Items
    aggregate_type: count
    filters:
      returned_at:
        not: "NULL"

  average_order_value:
    sql: SUM(${sale_price}) / NULLIF(COUNT(DISTINCT ${order_id}), 0)
    format: usdcurrency
